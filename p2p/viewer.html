<!doctype html>
<html lang="en">

<title>P2P agent board</title>
<style>

* { box-sizing:border-box; } body { margin:0; display:flex; flex-direction:column; height:100dvh; } button { cursor:pointer; } button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline:2px solid #fbbf24; outline-offset:2px; }

.message { border-bottom:1px solid #475569; padding:.5rem 0; } .message:target { background:#334155; } .message h3 { font-size:.95rem; margin:0 0 .3rem; } .message small { color:#aeb8c8; } .markdown { line-height:1.5; } .markdown h1,.markdown h2,.markdown h3 { margin:.7em 0 .35em; } .markdown h1 { font-size:1.4rem; } .markdown h2 { font-size:1.2rem; } .markdown p { margin:.5em 0; } .markdown pre { overflow:auto; padding:.75rem; border-radius:6px; background:#030712; } .markdown code { padding:.1em .3em; border-radius:3px; background:#374151; } .markdown pre code { padding:0; background:transparent; } .markdown blockquote { margin:.5em 0; padding-left:.8rem; border-left:3px solid #6b7280; } .markdown a { color:#93c5fd; } .note { color:#fbbf24; } details { margin:.5rem 0; } .window li { margin:.25rem 0; }
#help { position:absolute; bottom:8px; left:8px; background:#111827dd; padding:5px; pointer-events:none; } #list-panel { position:absolute; right:8px; bottom:8px; max-width:min(400px,90%); max-height:35%; overflow:auto; background:#1f2937; pointer-events:auto; padding:.4rem; } #list-panel button { color:#e5e7eb; background:none; border:0; text-align:left; } #list-panel button:hover { text-decoration:underline; }

</style>
</head>
<body>
<header><h1>P2P agent board</h1><span id="connection" role="status">Connecting…</span><span id="count">0 interactions</span><span id="notice" role="status">Partial coverage: older or opted-out agents may not report.</span><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-reset">100%</button><button id="fit">Fit agents</button><button id="layout-reset">Reset layout</button></header>
<main id="board" aria-label="Interactive agent board"><div id="world"><svg id="edges" aria-label="Agent connections"></svg><div id="agents"></div></div><div id="window-layer"></div><div id="help">Drag agents to arrange · drag background to pan · scroll to pan · Ctrl/⌘+scroll to zoom · click agents or connections for history</div><details id="list-panel"><summary>Interactions (text)</summary><ol id="text-events" aria-label="Chronological interaction list"></ol></details></main>
<script>
const $ = selector => document.querySelector(selector);
const board = $('#board'), world = $('#world'), edges = $('#edges'), agents = $('#agents'), layer = $('#window-layer');
const items = new Map(), positions = new Map(), cards = new Map(), lines = new Map(), windows = new Map();
const laneKey = peer => JSON.stringify([peer.id, peer.epoch]);
const pairKey = (a,b) => JSON.stringify([a,b].sort());
const pairMembers = key => { try { const members=JSON.parse(key); return Array.isArray(members) && members.length===2 ? members : []; } catch { return []; } };
const label = peer => `${peer.name || 'Agent'} (${peer.id.slice(0,8)})`;
const NS = 'http://www.w3.org/2000/svg', storageKey = 'pi-intercom-board-v1';
let x = 60, y = 60, zoom = 1, topZ = 2, partial = false, truncated = false, connected = 0, moving = null, painting = false;
function save() { try { localStorage.setItem(storageKey, JSON.stringify({ x,y,zoom,positions:[...positions] })); } catch {} }
try {
  const state = JSON.parse(localStorage.getItem(storageKey) || '{}');
  if (Number.isFinite(state.x) && Math.abs(state.x) < 1e6) x = state.x;
  if (Number.isFinite(state.y) && Math.abs(state.y) < 1e6) y = state.y;
  if (Number.isFinite(state.zoom) && state.zoom >= .25 && state.zoom <= 2) zoom = state.zoom;
  if (Array.isArray(state.positions)) for (const entry of state.positions) { if (!Array.isArray(entry) || entry.length!==2) continue; const [key,pos]=entry; if (typeof key === 'string' && Array.isArray(pos) && pos.length === 2 && pos.every(n => typeof n==='number' && Number.isFinite(n) && Math.abs(n) < 1e6)) positions.set(key,pos); }
} catch {}
function camera() { world.style.transform = `translate(${x}px,${y}px) scale(${zoom})`; save(); }
function setZoom(value,cx = board.clientWidth/2,cy = board.clientHeight/2) { const next = Math.max(.25,Math.min(2,value)); x = cx-(cx-x)*next/zoom; y = cy-(cy-y)*next/zoom; zoom = next; camera(); }
function fit() { if (!positions.size) return; const points = [...positions.values()]; const minX = Math.min(...points.map(p=>p[0])), maxX = Math.max(...points.map(p=>p[0]+190)), minY = Math.min(...points.map(p=>p[1])), maxY = Math.max(...points.map(p=>p[1]+80)); zoom = Math.max(.25,Math.min(2,Math.min((board.clientWidth-60)/(maxX-minX),(board.clientHeight-60)/(maxY-minY)))); x=(board.clientWidth-(maxX+minX)*zoom)/2; y=(board.clientHeight-(maxY+minY)*zoom)/2; camera(); }
function paint() { if (painting) return; painting=true; requestAnimationFrame(() => { painting=false; const coords=[...positions.values()]; if (coords.length) { const left=Math.min(...coords.map(p=>p[0]))-140,top=Math.min(...coords.map(p=>p[1]))-140,right=Math.max(...coords.map(p=>p[0]+190))+140,bottom=Math.max(...coords.map(p=>p[1]+80))+140; edges.style.left=`${left}px`; edges.style.top=`${top}px`; edges.style.width=`${right-left}px`; edges.style.height=`${bottom-top}px`; edges.setAttribute('viewBox',`${left} ${top} ${right-left} ${bottom-top}`); } for (const [key,card] of cards) { const [px,py]=positions.get(key); card.style.left=`${px}px`; card.style.top=`${py}px`; } for (const [key,line] of lines) { const [a,b]=pairMembers(key), [ax,ay]=positions.get(a), [bx,by]=positions.get(b); const cx=ax+95,cy=ay+40,tx=bx+95,ty=by+40,dx=tx-cx,dy=ty-cy,ratio=Math.min(95/Math.max(1,Math.abs(dx)),40/Math.max(1,Math.abs(dy))); const startX=cx+dx*ratio,startY=cy+dy*ratio,endX=tx-dx*ratio,endY=ty-dy*ratio; const path=a===b ? `M${cx+40} ${cy-30} C${cx+125} ${cy-105} ${cx-125} ${cy-105} ${cx-40} ${cy-30}` : `M${startX} ${startY} L${endX} ${endY}`; line.querySelectorAll('path').forEach(p=>p.setAttribute('d',path)); const text=line.querySelector('text'); text.setAttribute('x',(startX+endX)/2); text.setAttribute('y',a===b ? startY-95 : (startY+endY)/2-9); } }); }
function notice() { $('#notice').textContent = `${connected ? '' : 'No connected reporters. '}Partial coverage: older/opted-out agents do not report${partial ? '; telemetry dropped' : ''}${truncated ? '; history limited to 1,000' : ''}. No backfill or persistence of messages.`; }
function link(labelText,id) { const button=document.createElement('button'); button.textContent=labelText; button.addEventListener('click',()=> { const target=[...items.values()].find(item=>item.messageId===id && item.action!=='cancel'); if (target) { openWindow('pair',pairKey(laneKey(target.from),laneKey(target.to))); focusMessage(target.id); } else $('#notice').textContent='Message not in retained history.'; }); return button; }
function renderInline(source,parent) {
  const tokens=/`([^`\n]+)`|\*\*([^*\n]+)\*\*|\*([^*\n]+)\*|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g;
  let start=0;
  for (const match of source.matchAll(tokens)) {
    parent.append(document.createTextNode(source.slice(start,match.index)));
    let node;
    if (match[1]) { node=document.createElement('code'); node.textContent=match[1]; }
    else if (match[2]) { node=document.createElement('strong'); node.textContent=match[2]; }
    else if (match[3]) { node=document.createElement('em'); node.textContent=match[3]; }
    else { node=document.createElement('a'); node.textContent=match[4]; try { const url=new URL(match[5]); if (url.protocol==='http:' || url.protocol==='https:') { node.href=url.href; node.rel='noopener noreferrer'; node.target='_blank'; } } catch {} }

function renderMarkdown(source,parent) {

  const flush=()=> { if (paragraph.length) { const p=document.createElement('p'); renderInline(paragraph.join(' '),p); parent.append(p); paragraph=[]; } list=null; };
  for (const line of lines) {
    if (/^\s*```/.test(line)) { if (code) { const pre=document.createElement('pre'),content=document.createElement('code'); content.textContent=code.join('\n'); pre.append(content); parent.append(pre); code=null; } else { flush(); code=[]; } continue; }
    if (code) { code.push(line); continue; }
    if (!line.trim()) { flush(); continue; }
    const heading=line.match(/^\s{0,3}(#{1,6})\s+(.+)$/);
    if (heading) { flush(); const h=document.createElement(`h${heading[1].length}`); renderInline(heading[2],h); parent.append(h); continue; }
    const item=line.match(/^\s{0,3}([-*+]|\d+\.)\s+(.+)$/);
    if (item) { if (paragraph.length) flush(); const type=/\d/.test(item[1][0])?'ol':'ul'; if (!list || list.localName!==type) { list=document.createElement(type); parent.append(list); } const li=document.createElement('li'); renderInline(item[2],li); list.append(li); continue; }
    if (line.startsWith('> ')) { flush(); const quote=document.createElement('blockquote'); renderInline(line.slice(2),quote); parent.append(quote); continue; }
    list=null; paragraph.push(line);
  }
  if (code) { const pre=document.createElement('pre'),content=document.createElement('code'); content.textContent=code.join('\n'); pre.append(content); parent.append(pre); } flush();
}
function matches(item,type,key) { return type==='agent' ? [item.from,item.to].some(p=>laneKey(p)===key) : pairKey(laneKey(item.from),laneKey(item.to))===key; }
function message(item) {
  const entry=document.createElement('article'); entry.className='message'; entry.dataset.id=item.id;
  const title=document.createElement('h3'); title.textContent=`${label(item.from)} → ${label(item.to)} · intercom.${item.action} · ${item.status}`;
  const date=document.createElement('small'); date.textContent=`${new Date(item.timestamp).toLocaleString()} (sender clock may differ) · ${item.messageId}`;
  const body=document.createElement('div'); body.className='markdown';
  if (item.body===undefined) body.textContent='Message text unavailable (older agent, opt-out, or no backfill).';
  else if (!item.body) body.textContent='(Empty message)';
  else renderMarkdown(item.body,body);
  if (item.bodyTruncated) { const note=document.createElement('p'); note.className='note'; note.textContent='Message text truncated by telemetry or snapshot limits.'; body.append(note); }
  const more=document.createElement('details'),summary=document.createElement('summary'); summary.textContent='Observations and metadata'; more.append(summary);
  const meta=document.createElement('div'); meta.textContent=`From: ${item.from.id}, epoch ${item.from.epoch}\nTo: ${item.to.id}, epoch ${item.to.epoch}\n${item.updates.map(u=>`${new Date(u.timestamp).toLocaleTimeString()} ${u.status} · ${u.reporter}`).join('\n')}`; meta.style.whiteSpace='pre-wrap'; more.append(meta);
  for (const key of ['linkedTo','replyTo','retryOf','supersedes']) if (item[key]) more.append(document.createElement('br'),link(`${key}: ${key==='linkedTo' ? item.messageId : item[key]}`,key==='linkedTo' ? item.messageId : item[key]));
  if (item.artifacts) { const a=item.artifacts,info=document.createElement('p'); info.textContent=`${a.totalCount} artifacts · ${a.totalBytes} bytes${a.omitted ? ` · ${a.omitted} omitted` : ''}`; more.append(info); const ul=document.createElement('ul'); for (const attachment of a.attachments) { const li=document.createElement('li'); li.textContent=`${attachment.type}: ${attachment.name}`; ul.append(li); } for (const file of a.manifest) { const li=document.createElement('li'); li.textContent=`${file.type}: ${file.path}${file.size===undefined ? ' (size unknown)' : ` (${file.size} bytes)`}`; ul.append(li); } more.append(ul); }
  entry.append(title,date,body,more); return entry;
}
function clampWindow(win) { const width=Math.min(win.offsetWidth,board.clientWidth),height=Math.min(win.offsetHeight,board.clientHeight); win.style.width=`${width}px`; win.style.height=`${height}px`; win.style.left=`${Math.max(0,Math.min(parseFloat(win.style.left)||0,Math.max(0,board.clientWidth-60)))}px`; win.style.top=`${Math.max(0,Math.min(parseFloat(win.style.top)||0,Math.max(0,board.clientHeight-36)))}px`; }
function refreshWindow(record) {
  const {body,newButton,type,key}=record, atBottom=body.scrollHeight-body.scrollTop-body.clientHeight<40, oldTop=body.scrollTop;
  const current=[...items.values()].filter(item=>matches(item,type,key));
  const wanted=new Set(current.map(item=>item.id)), existing=new Map([...body.children].map(entry=>[entry.dataset.id,entry])); for (const [id,entry] of existing) if (!wanted.has(id)) { entry.remove(); existing.delete(id); }
  for (const item of current) { let entry=existing.get(item.id); const version=JSON.stringify(item); if (!entry) { entry=message(item); entry.dataset.version=version; body.append(entry); } else if (entry.dataset.version!==version) { const replacement=message(item); replacement.dataset.version=version; replacement.querySelector('details').open=entry.querySelector('details').open; entry.replaceWith(replacement); } }
  if (!current.length) { body.replaceChildren(); const empty=document.createElement('p'); empty.textContent='No messages in retained history (collector may have restarted or evicted them).'; body.append(empty); }
  if (atBottom) { body.scrollTop=body.scrollHeight; newButton.hidden=true; } else { body.scrollTop=oldTop; if (current.length>record.count) newButton.hidden=false; } record.count=current.length;
}
function openWindow(type,key,opener=document.activeElement) {
  const id=JSON.stringify([type,key]); if (windows.has(id)) { const record=windows.get(id); record.win.style.zIndex=++topZ; record.win.focus(); return record; }
  const win=document.createElement('section'); win.className='window'; win.tabIndex=-1; win.style.left=`${25+(windows.size%6)*28}px`; win.style.top=`${25+(windows.size%6)*28}px`; win.style.width=`${Math.min(520,board.clientWidth)}px`; win.style.height=`${Math.min(420,board.clientHeight)}px`; win.style.zIndex=++topZ;
  const bar=document.createElement('div'); bar.className='window-bar'; bar.tabIndex=0; bar.setAttribute('aria-label','Move conversation window with arrow keys');
  const title=document.createElement('strong'); title.textContent=type==='agent' ? `Agent: ${label([...items.values()].flatMap(i=>[i.from,i.to]).find(p=>laneKey(p)===key) || {name:'Agent',id:key})}` : `Conversation: ${pairMembers(key).map(k=> { const p=[...items.values()].flatMap(i=>[i.from,i.to]).find(peer=>laneKey(peer)===k); return p ? label(p) : 'Agent'; }).join(' ↔ ')}`;
  const close=document.createElement('button'); close.textContent='×'; close.setAttribute('aria-label','Close conversation'); close.addEventListener('click',()=> { windows.delete(id); observer.disconnect(); win.remove(); if (opener?.isConnected) opener.focus(); }); bar.append(title,close);
  const resize=document.createElement('button'); resize.textContent='↘'; resize.title='Resize with arrow keys'; resize.setAttribute('aria-label','Resize window with arrow keys'); resize.addEventListener('keydown',event=> { const delta={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[event.key]; if (!delta) return; event.stopPropagation(); event.preventDefault(); win.style.width=`${Math.max(Math.min(320,board.clientWidth),Math.min(board.clientWidth,win.offsetWidth+delta[0]))}px`; win.style.height=`${Math.max(Math.min(220,board.clientHeight),Math.min(board.clientHeight,win.offsetHeight+delta[1]))}px`; }); bar.append(resize);
  const body=document.createElement('div'); body.className='window-body'; const newButton=document.createElement('button'); newButton.className='new'; newButton.textContent='New messages ↓'; newButton.hidden=true; newButton.addEventListener('click',()=> { body.scrollTop=body.scrollHeight; newButton.hidden=true; });
  win.append(bar,body,newButton); layer.append(win); clampWindow(win);
  const record={ win,body,newButton,type,key,count:0 }; windows.set(id,record); refreshWindow(record); win.focus();
  win.addEventListener('pointerdown',()=> { win.style.zIndex=++topZ; });
  bar.addEventListener('pointerdown',event=> { if (event.target.closest('button')) return; event.preventDefault(); bar.setPointerCapture(event.pointerId); const px=event.clientX,py=event.clientY,left=parseFloat(win.style.left),top=parseFloat(win.style.top); const move=e=> { win.style.left=`${left+e.clientX-px}px`; win.style.top=`${top+e.clientY-py}px`; clampWindow(win); }; bar.addEventListener('pointermove',move); bar.addEventListener('pointerup',()=>bar.removeEventListener('pointermove',move),{once:true}); });
  bar.addEventListener('keydown',event=> { if (event.target!==bar) return; const delta={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[event.key]; if (!delta) return; event.preventDefault(); win.style.left=`${parseFloat(win.style.left)+delta[0]}px`; win.style.top=`${parseFloat(win.style.top)+delta[1]}px`; clampWindow(win); });
  win.addEventListener('keydown',event=> { if (event.key==='Escape') { event.preventDefault(); close.click(); } });
  const observer=new ResizeObserver(()=>clampWindow(win)); observer.observe(win);

}
function focusMessage(id) { for (const record of windows.values()) { const entry=[...record.body.children].find(child=>child.dataset.id===id); if (entry) { record.win.style.zIndex=++topZ; entry.scrollIntoView({block:'center'}); entry.style.background='#374151'; setTimeout(()=>entry.style.background='',1500); return; } } }
function reconcile() {
  $('#count').textContent=`${items.size} interaction${items.size===1 ? '' : 's'}`;
  const peers=new Map(),pairs=new Map(); for (const item of items.values()) { for (const peer of [item.from,item.to]) peers.set(laneKey(peer),peer); const from=laneKey(item.from),to=laneKey(item.to),key=pairKey(from,to),counts=pairs.get(key)||[0,0]; counts[from<=to ? 0 : 1]++; pairs.set(key,counts); }

  for (const [key,card] of cards) if (!peers.has(key)) { card.remove(); cards.delete(key); }
  for (const [key,peer] of peers) { if (!positions.has(key)) { const index=positions.size; positions.set(key,[(index%4)*260,Math.floor(index/4)*180]); } if (cards.has(key)) continue;
    const card=document.createElement('button'); card.className='agent'; card.title=`${peer.id}, epoch ${peer.epoch}`; const strong=document.createElement('strong'),small=document.createElement('small'); strong.textContent=peer.name||'Agent'; small.textContent=peer.id.slice(0,8); card.append(strong,small); agents.append(card); cards.set(key,card);
    let suppressClick=false;
    card.addEventListener('click',()=> { if (suppressClick) { suppressClick=false; return; } openWindow('agent',key,card); });
    card.addEventListener('pointerdown',event=> { if (event.button!==0) return; event.stopPropagation(); card.setPointerCapture(event.pointerId); const [px,py]=positions.get(key); moving={card,key,startX:event.clientX,startY:event.clientY,px,py,dragged:false}; });
    card.addEventListener('pointermove',event=> { if (moving?.card!==card) return; const dx=event.clientX-moving.startX,dy=event.clientY-moving.startY; if (Math.hypot(dx,dy)>4) moving.dragged=true; if (moving.dragged) { positions.set(key,[moving.px+dx/zoom,moving.py+dy/zoom]); card.classList.add('dragging'); paint(); } });
    card.addEventListener('pointerup',event=> { if (moving?.card!==card) return; const dragged=moving.dragged; moving=null; card.classList.remove('dragging'); if (dragged) { suppressClick=true; setTimeout(()=> { suppressClick=false; },0); save(); } });
    card.addEventListener('keydown',event=> { const delta={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[event.key]; if (!delta) return; event.preventDefault(); const [px,py]=positions.get(key); positions.set(key,[px+delta[0],py+delta[1]]); paint(); save(); });
  }
  for (const [key,line] of lines) if (!pairs.has(key)) { line.remove(); lines.delete(key); }
  for (const [key,counts] of pairs) { let line=lines.get(key); if (!line) { line=document.createElementNS(NS,'g'); line.classList.add('edge'); line.setAttribute('role','button'); line.setAttribute('tabindex','0'); for (const name of ['visible','hit']) { const path=document.createElementNS(NS,'path'); path.classList.add(name); line.append(path); } line.append(document.createElementNS(NS,'text')); edges.append(line); lines.set(key,line); line.addEventListener('click',()=>openWindow('pair',key,line)); line.addEventListener('keydown',event=> { if (event.key==='Enter'||event.key===' ') { event.preventDefault(); openWindow('pair',key,line); } }); } line.querySelector('text').textContent=pairMembers(key)[0]===pairMembers(key)[1] ? `${counts[0]} loop` : `${counts[0]} → · ${counts[1]} ←`; line.setAttribute('aria-label',`${counts[0]+counts[1]} interactions between agents. Open conversation`); }
  const list=$('#text-events'); list.replaceChildren(); for (const item of items.values()) { const li=document.createElement('li'),button=document.createElement('button'); button.textContent=`${label(item.from)} → ${label(item.to)}: intercom.${item.action}, ${item.status}`; button.addEventListener('click',()=> { openWindow('pair',pairKey(laneKey(item.from),laneKey(item.to)),button); focusMessage(item.id); }); li.append(button); list.append(li); }
  paint(); for (const record of windows.values()) refreshWindow(record); notice(); save();
}
board.addEventListener('pointerdown',event=> { if (event.button!==0 || event.target.closest('.window,#list-panel,.agent,.edge')) return; board.setPointerCapture(event.pointerId); moving={startX:event.clientX,startY:event.clientY,px:x,py:y}; board.classList.add('panning'); });
board.addEventListener('pointermove',event=> { if (!moving || moving.card) return; x=moving.px+event.clientX-moving.startX; y=moving.py+event.clientY-moving.startY; camera(); });
board.addEventListener('pointerup',()=> { if (!moving?.card) { moving=null; board.classList.remove('panning'); } });
board.addEventListener('wheel',event=> { if (event.target.closest('.window,#list-panel')) return; event.preventDefault(); if (event.ctrlKey || event.metaKey) { const rect=board.getBoundingClientRect(); setZoom(zoom*Math.exp(-event.deltaY*.002),event.clientX-rect.left,event.clientY-rect.top); } else { x-=event.deltaX; y-=event.deltaY; camera(); } },{passive:false});
$('#zoom-in').addEventListener('click',()=>setZoom(zoom*1.25)); $('#zoom-out').addEventListener('click',()=>setZoom(zoom/1.25)); $('#zoom-reset').addEventListener('click',()=>setZoom(1)); $('#fit').addEventListener('click',fit); $('#layout-reset').addEventListener('click',()=> { positions.clear(); reconcile(); fit(); });
window.addEventListener('resize',()=> { for (const record of windows.values()) clampWindow(record.win); }); camera();
const stream=new EventSource('/events');
stream.addEventListener('open',()=> { $('#connection').textContent='Live'; $('#connection').classList.add('live'); });
stream.addEventListener('error',()=> { $('#connection').textContent='Reconnecting…'; $('#connection').classList.remove('live'); });
stream.addEventListener('snapshot',event=> { try { const data=JSON.parse(event.data); items.clear(); for (const item of data.interactions) items.set(item.id,item); truncated=data.truncated; partial=data.partial; connected=data.connectedReporters ?? 0; reconcile(); } catch { $('#notice').textContent='Invalid telemetry snapshot'; } });
stream.addEventListener('interaction',event=> { try { const data=JSON.parse(event.data); if (data.evicted) items.delete(data.evicted); items.set(data.interaction.id,data.interaction); truncated=data.truncated; partial=data.partial; reconcile(); } catch { $('#notice').textContent='Invalid telemetry update'; } });
stream.addEventListener('status',event=> { try { const status=JSON.parse(event.data); if (Number.isSafeInteger(status.connectedReporters)) connected=status.connectedReporters; partial ||= !!status.partial; truncated ||= !!status.truncated; notice(); } catch { $('#notice').textContent='Invalid telemetry status'; } });
</script>
</body>
</html>
