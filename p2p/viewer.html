  bar.addEventListener('pointerdown',event=> { if (event.target.closest('button')) return; event.preventDefault(); bar.setPointerCapture(event.pointerId); const px=event.clientX,py=event.clientY,left=parseFloat(win.style.left),top=parseFloat(win.style.top); const move=e=> { win.style.left=`${left+e.clientX-px}px`; win.style.top=`${top+e.clientY-py}px`; clampWindow(win); }; bar.addEventListener('pointermove',move); bar.addEventListener('pointerup',()=>bar.removeEventListener('pointermove',move),{once:true}); });

function focusMessage(id) { for (const record of windows.values()) { const entry=[...record.body.children].find(child=>child.dataset.id===id); if (entry) { record.win.style.zIndex=++topZ; entry.scrollIntoView({block:'center'}); entry.style.background='var(--subpanel)'; setTimeout(()=>entry.style.background='',1500); return; } } }
function animateConnection(item) {
  if (!['send','ask','reply'].includes(item.action)) return;
  const line=lines.get(pairKey(laneKey(item.from),laneKey(item.to)));
  if (!line) return;
  clearTimeout(line.pulseTimer);
  line.classList.remove('sending');
  void line.getBoundingClientRect(); // restart the dash animation for consecutive messages

  line.pulseTimer=setTimeout(()=>line.classList.remove('sending'),1800);
}
function reconcile() {

  const peers=new Map(),pairs=new Map(); for (const item of items.values()) { for (const peer of [item.from,item.to]) { const key=laneKey(peer); if (peer.hostname || !peers.get(key)?.hostname) peers.set(key,peer); } const from=laneKey(item.from),to=laneKey(item.to),key=pairKey(from,to),counts=pairs.get(key)||[0,0]; counts[from<=to ? 0 : 1]++; pairs.set(key,counts); }

  for (const [key,peer] of peers) if (!peer.hostname?.trim()) peers.delete(key);
  for (const key of pairs.keys()) if (pairMembers(key).some(member=>!peers.has(member))) pairs.delete(key);
  for (const key of positions.keys()) if (!peers.has(key)) { positions.delete(key); layoutVersions.delete(key); }
  for (const [key,card] of cards) if (!peers.has(key)) { card.remove(); cards.delete(key); }
  machineOf.clear(); for (const [key,peer] of peers) machineOf.set(key,machineKey(peer));
  for (const [machine,frame] of groups) if (![...machineOf.values()].includes(machine)) { frame.remove(); groups.delete(machine); }
  for (const machine of new Set(machineOf.values())) {
    const count=[...machineOf.values()].filter(value=>value===machine).length;
    let frame=groups.get(machine);
    if (!frame) {
      frame=document.createElement('div'); frame.className='machine-frame';
      const title=document.createElement('button'); title.className='machine-title'; frame.append(title); groupLayer.append(frame); groups.set(machine,frame);
      title.addEventListener('pointerdown',event=> { if (event.button!==0) return; event.stopPropagation(); title.setPointerCapture(event.pointerId); moving={group:machine,startX:event.clientX,startY:event.clientY,dx:0,dy:0}; });
      title.addEventListener('pointermove',event=> { if (moving?.group!==machine) return; const dx=(event.clientX-moving.startX)/zoom,dy=(event.clientY-moving.startY)/zoom; moveGroup(machine,dx-moving.dx,dy-moving.dy); moving.dx=dx; moving.dy=dy; title.classList.add('dragging'); });
      title.addEventListener('pointerup',event=> { if (moving?.group!==machine) return; const dx=(event.clientX-moving.startX)/zoom,dy=(event.clientY-moving.startY)/zoom; moveGroup(machine,dx-moving.dx,dy-moving.dy); moving=null; title.classList.remove('dragging'); publishGroup(machine,dx,dy); });

      title.addEventListener('keydown',event=> { const delta={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[event.key]; if (!delta) return; event.preventDefault(); moveGroup(machine,...delta); publishGroup(machine,...delta); });
    }

    frame.firstElementChild.setAttribute('aria-label',`Move machine ${machine} (${count} agents). Use arrow keys to reposition.`);
  }
  for (const [key,peer] of peers) { if (!positions.has(key)) { const index=positions.size; positions.set(key,[(index%4)*260,Math.floor(index/4)*180]); }
    let card=cards.get(key);
    if (card) { card.querySelector('strong').textContent=peer.name||'Agent'; card.classList.toggle('working',presence.get(key)?.active===true); card.title=`${peer.id}, epoch ${peer.epoch} · ${presence.has(key) ? (presence.get(key).active ? 'working' : 'idle') : 'activity unknown'}`; card.setAttribute('aria-label',`${label(peer)} · ${presence.has(key) ? (presence.get(key).active ? 'working' : 'idle') : 'activity unknown'}`); continue; }
    card=document.createElement('button'); card.className='agent'; card.classList.toggle('working',presence.get(key)?.active===true); card.title=`${peer.id}, epoch ${peer.epoch} · ${presence.has(key) ? (presence.get(key).active ? 'working' : 'idle') : 'activity unknown'}`; card.setAttribute('aria-label',`${label(peer)} · ${presence.has(key) ? (presence.get(key).active ? 'working' : 'idle') : 'activity unknown'}`); const strong=document.createElement('strong'),small=document.createElement('small'); strong.textContent=peer.name||'Agent'; small.textContent=peer.id.slice(0,8); card.append(strong,small); agents.append(card); cards.set(key,card);
    let suppressClick=false;
    card.addEventListener('click',()=> { if (suppressClick) { suppressClick=false; return; } openWindow('agent',key,card); });
    card.addEventListener('pointerdown',event=> { if (event.button!==0) return; event.stopPropagation(); card.setPointerCapture(event.pointerId); const [px,py]=positions.get(key); moving={card,key,startX:event.clientX,startY:event.clientY,px,py,dragged:false}; });
    card.addEventListener('pointermove',event=> { if (moving?.card!==card) return; const dx=event.clientX-moving.startX,dy=event.clientY-moving.startY; if (Math.hypot(dx,dy)>4) moving.dragged=true; if (moving.dragged) { positions.set(key,[moving.px+dx/zoom,moving.py+dy/zoom]); card.classList.add('dragging'); paint(); publishPosition(key); } });
    card.addEventListener('pointerup',event=> { if (moving?.card!==card) return; const dragged=moving.dragged; moving=null; card.classList.remove('dragging'); if (dragged) { suppressClick=true; setTimeout(()=> { suppressClick=false; },0); publishPosition(key,true); } });
    card.addEventListener('keydown',event=> { const delta={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[event.key]; if (!delta) return; event.preventDefault(); const [px,py]=positions.get(key); positions.set(key,[px+delta[0],py+delta[1]]); paint(); publishPosition(key,true); });
  }
  for (const [key,line] of lines) if (!pairs.has(key)) { clearTimeout(line.pulseTimer); line.remove(); lines.delete(key); }
  for (const [key,counts] of pairs) { let line=lines.get(key); if (!line) { line=document.createElementNS(NS,'g'); line.classList.add('edge'); line.setAttribute('role','button'); line.setAttribute('tabindex','0'); for (const name of ['visible','hit']) { const path=document.createElementNS(NS,'path'); path.classList.add(name); line.append(path); } line.append(document.createElementNS(NS,'text')); edges.append(line); lines.set(key,line); line.addEventListener('click',()=>openWindow('pair',key,line)); line.addEventListener('keydown',event=> { if (event.key==='Enter'||event.key===' ') { event.preventDefault(); openWindow('pair',key,line); } }); } line.querySelector('text').textContent=pairMembers(key)[0]===pairMembers(key)[1] ? `${counts[0]} loop` : `${counts[0]} → · ${counts[1]} ←`; line.setAttribute('aria-label',`${counts[0]+counts[1]} interactions between agents. Open conversation`); }
  const list=$('#text-events'); list.replaceChildren(); for (const item of items.values()) { const li=document.createElement('li'),button=document.createElement('button'); button.textContent=`${label(item.from)} → ${label(item.to)}: intercom.${item.action}, ${item.status}`; button.addEventListener('click',()=> { openWindow('pair',pairKey(laneKey(item.from),laneKey(item.to)),button); focusMessage(item.id); }); li.append(button); list.append(li); }
  paint(); for (const record of windows.values()) refreshWindow(record); notice(); save();
}
board.addEventListener('pointerdown',event=> { if (event.button!==0 || event.target.closest('.window,#list-panel,.agent,.edge,.machine-title')) return; board.setPointerCapture(event.pointerId); moving={startX:event.clientX,startY:event.clientY,px:x,py:y}; board.classList.add('panning'); });
board.addEventListener('pointermove',event=> { if (!moving || moving.card || moving.group) return; x=moving.px+event.clientX-moving.startX; y=moving.py+event.clientY-moving.startY; camera(); });
board.addEventListener('pointerup',()=> { if (!moving?.card && !moving?.group) { moving=null; board.classList.remove('panning'); } });
board.addEventListener('wheel',event=> { if (event.target.closest('.window,#list-panel')) return; event.preventDefault(); if (event.ctrlKey || event.metaKey) { const rect=board.getBoundingClientRect(); setZoom(zoom*Math.exp(-event.deltaY*.002),event.clientX-rect.left,event.clientY-rect.top); } else { x-=event.deltaX; y-=event.deltaY; camera(); } },{passive:false});
$('#zoom-in').addEventListener('click',()=>setZoom(zoom*1.25)); $('#zoom-out').addEventListener('click',()=>setZoom(zoom/1.25)); $('#zoom-reset').addEventListener('click',()=>setZoom(1)); $('#fit').addEventListener('click',fit); $('#layout-reset').addEventListener('click',async()=> { try { const result=await fetch('/layout/reset',{method:'POST'}); if (!result.ok) throw new Error('Reset failed'); } catch { $('#notice').textContent='Could not reset shared layout.'; } });
window.addEventListener('resize',()=> { for (const record of windows.values()) clampWindow(record.win); }); camera();
const stream=new EventSource('/events');
stream.addEventListener('open',()=> { $('#connection').textContent='Live'; $('#connection').classList.add('live'); });
stream.addEventListener('error',()=> { $('#connection').textContent='Reconnecting…'; $('#connection').classList.remove('live'); });
stream.addEventListener('snapshot',event=> { try { const data=JSON.parse(event.data); items.clear(); presence.clear(); positions.clear(); layoutVersions.clear(); for (const [key,position] of data.layout || []) { positions.set(key,position); layoutVersions.set(key,data.layoutRevision || 0); } for (const item of data.interactions) items.set(item.id,item); for (const state of data.presence || []) presence.set(laneKey(state.peer),state); truncated=data.truncated; partial=data.partial; connected=data.connectedReporters ?? 0; reconcile(); } catch { $('#notice').textContent='Invalid telemetry snapshot'; } });
stream.addEventListener('interaction',event=> { try { const data=JSON.parse(event.data), previous=items.get(data.interaction.id); if (data.evicted) items.delete(data.evicted); items.set(data.interaction.id,data.interaction); truncated=data.truncated; partial=data.partial; reconcile(); if (!previous || previous.action==='receipt' && data.interaction.action!=='receipt') animateConnection(data.interaction); } catch { $('#notice').textContent='Invalid telemetry update'; } });

stream.addEventListener('status',event=> { try { const status=JSON.parse(event.data); if (Number.isSafeInteger(status.connectedReporters)) connected=status.connectedReporters; partial ||= !!status.partial; truncated ||= !!status.truncated; notice(); } catch { $('#notice').textContent='Invalid telemetry status'; } });
